<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Kamera Selfie SIM-PPNPN</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;margin:0;background:#f3f5f8;color:#172033}.wrap{max-width:520px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #0001}h2{font-size:20px;margin:0 0 8px}p{font-size:14px;color:#5b6472;line-height:1.45}video,img{width:100%;max-height:65vh;object-fit:contain;background:#111;border-radius:10px;display:block}img{display:none}button{border:0;border-radius:8px;padding:12px 14px;font-size:15px;font-weight:600;margin:8px 6px 0 0;background:#1769e0;color:white}button.secondary{background:#e8edf4;color:#172033}button:disabled{opacity:.5}#status{font-size:13px;color:#4b5563;min-height:36px;margin-top:10px}</style></head>
<body><main class="wrap"><section class="card"><h2>Kamera Selfie Presensi</h2><p>Presensi wajib menggunakan kamera depan. Foto tidak dapat dipilih dari galeri atau folder.</p><video id="video" autoplay playsinline muted></video><img id="preview" alt="Pratinjau foto selfie"><div id="status">Meminta izin kamera depan…</div><button id="capture" disabled>Ambil Foto</button><button id="redo" class="secondary" hidden>Foto Ulang</button><button id="send" disabled>Kirim Foto ke Presensi</button><button id="cancel" class="secondary">Batal</button></section></main>
<script>
(()=>{'use strict';const params=new URLSearchParams(location.search);const nonce=params.get('nonce');const targetOrigin=params.get('targetOrigin');const video=document.getElementById('video'),preview=document.getElementById('preview'),status=document.getElementById('status'),capture=document.getElementById('capture'),redo=document.getElementById('redo'),send=document.getElementById('send'),cancel=document.getElementById('cancel');let stream=null,data=null;
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
function message(type,extra={}){if(!window.opener||!nonce||!targetOrigin)return;window.opener.postMessage({type,nonce,...extra},targetOrigin)}
async function start(){stop();data=null;send.disabled=true;preview.style.display='none';video.style.display='block';capture.hidden=false;capture.disabled=true;redo.hidden=true;status.textContent='Meminta izin kamera depan…';try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Browser tidak mendukung kamera langsung.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'user'},width:{ideal:1280},height:{ideal:1280}}});video.srcObject=stream;await video.play();capture.disabled=false;status.textContent='Posisikan wajah di tengah, lalu tekan Ambil Foto.'}catch(e){stop();status.textContent='Kamera selfie wajib digunakan. Periksa izin kamera browser dan coba lagi. '+(e.message||'');capture.disabled=true}}
capture.addEventListener('click',()=>{try{if(!stream||!video.videoWidth)throw new Error('Kamera belum siap.');const scale=Math.min(1,1280/Math.max(video.videoWidth,video.videoHeight));const c=document.createElement('canvas');c.width=Math.round(video.videoWidth*scale);c.height=Math.round(video.videoHeight*scale);c.getContext('2d').drawImage(video,0,0,c.width,c.height);let q=.76;data=c.toDataURL('image/jpeg',q);while(data.length>2300000&&q>.4){q-=.1;data=c.toDataURL('image/jpeg',q)}if(data.length>2500000)throw new Error('Ukuran foto terlalu besar. Silakan ambil ulang.');preview.src=data;preview.style.display='block';video.style.display='none';stop();capture.hidden=true;redo.hidden=false;send.disabled=false;status.textContent='Periksa foto. Jika sesuai, tekan Kirim Foto ke Presensi.'}catch(e){status.textContent=e.message||'Foto gagal diambil';send.disabled=true}});
redo.addEventListener('click',start);send.addEventListener('click',()=>{if(!data)return;send.disabled=true;status.textContent='Mengirim foto kembali ke aplikasi…';message('SIM_PPNPN_SELFIE_CAPTURED',{imageData:data});status.textContent='Foto terkirim. Anda dapat kembali ke aplikasi.';setTimeout(()=>window.close(),400)});cancel.addEventListener('click',()=>{message('SIM_PPNPN_SELFIE_CANCEL');stop();window.close()});window.addEventListener('pagehide',stop);if(!nonce||!targetOrigin||!window.opener){status.textContent='Halaman harus dibuka dari tombol presensi SIM-PPNPN. Tutup halaman ini dan ulangi dari aplikasi.'}else start();})();
</script></body></html>
